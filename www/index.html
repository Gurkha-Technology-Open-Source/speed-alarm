<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0f1420" id="meta-theme-color">
    <script>
        (function () {
            try {
                var raw = localStorage.getItem('speedalarm.settings.v1');
                if (!raw) return;
                var theme = JSON.parse(raw).theme || 'system';
                var dark =
                    theme === 'dark' ||
                    (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            } catch (e) { /* ignore */ }
        })();
    </script>
    <title>स्पिड अलार्म</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="overspeed-flash" aria-hidden="true"></div>

    <header class="app-header">
        <div class="brand">
            <img src="assets/icon.svg" alt="" class="brand-icon" width="32" height="32" draggable="false">
            <h1 data-i18n="appName">स्पिड अलार्म</h1>
        </div>
        <button type="button" id="gps-status" class="status-pill status-idle" data-i18n-aria="gpsTapStart" aria-label="GPS बन्द">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="gps-status-text">GPS बन्द</span>
        </button>
    </header>

    <main>
        <section id="screen-home" class="screen active">
            <div id="gauge-wrap">
                <svg id="gauge" viewBox="0 0 200 150" role="img" data-i18n-aria="gaugeLabel" aria-label="स्पिडोमिटर"></svg>
                <div id="gauge-center">
                    <div id="speed-value" class="placeholder">--</div>
                    <div id="speed-unit">km/h</div>
                </div>
            </div>

            <button type="button" id="limit-chip" class="limit-chip" data-i18n-aria="limitChange">
                <span class="limit-chip-kicker" data-i18n="limit">सीमा</span>
                <span class="limit-chip-value-row">
                    <strong id="limit-chip-value">50</strong>
                    <span id="limit-chip-unit">km/h</span>
                </span>
                <svg class="limit-chip-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>

            <div id="overspeed-banner" class="overspeed-banner hidden">
                <svg class="banner-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 21h20L12 3zm0 6.5a1 1 0 0 1 1 1v4a1 1 0 1 1-2 0v-4a1 1 0 0 1 1-1zm0 8.2a1.15 1.15 0 1 1 0 2.3 1.15 1.15 0 0 1 0-2.3z"/></svg>
                <span data-i18n="overspeedBanner">बिस्तारै चलाउनुहोस् — सीमा नाघ्यो</span>
                <button type="button" id="mute-btn" class="btn-small" data-i18n="mute">मौन</button>
            </div>

            <div class="trip-stats">
                <div class="stat"><span class="stat-label" data-i18n="statDistance">दूरी</span><span class="stat-value" id="stat-distance">0.0 km</span></div>
                <div class="stat"><span class="stat-label" data-i18n="statDuration">अवधि</span><span class="stat-value" id="stat-duration">0:00</span></div>
                <div class="stat"><span class="stat-label" data-i18n="statAvg">औसत</span><span class="stat-value" id="stat-avg">--</span></div>
                <div class="stat"><span class="stat-label" data-i18n="statMax">अधिकतम</span><span class="stat-value" id="stat-max">--</span></div>
            </div>

            <button type="button" id="start-stop-btn" class="btn-primary">
                <svg class="btn-icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>
                <svg class="btn-icon icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect fill="currentColor" x="6" y="6" width="12" height="12" rx="2"/></svg>
                <span id="start-stop-label" data-i18n="startTrip">यात्रा सुरु</span>
            </button>
            <p id="home-hint" class="hint hint-callout hidden"></p>
        </section>

        <section id="screen-trips" class="screen">
            <h2 class="screen-title" data-i18n="tabTrips">यात्रा</h2>
            <div class="totals-row">
                <div class="total-card"><span id="total-distance">0</span><label id="total-distance-label">km जम्मा</label></div>
                <div class="total-card"><span id="total-trips">0</span><label data-i18n="tripsCount">यात्रा</label></div>
                <div class="total-card" id="total-score-card"><span id="total-score">--</span><label data-i18n="safetyScore">सुरक्षा अङ्क</label></div>
            </div>
            <div id="trip-list" class="trip-list"></div>
            <button type="button" id="clear-history-btn" class="btn-danger-outline hidden" data-i18n="clearHistory">इतिहास मेटाउनुहोस्</button>
        </section>

        <section id="screen-settings" class="screen">
            <h2 class="screen-title" data-i18n="tabSettings">सेटिङ</h2>

            <p class="section-label" id="limit-section-label" data-i18n="speedLimit">गति सीमा</p>
            <div class="setting-group">
                <div class="stepper">
                    <button type="button" id="threshold-dec" class="stepper-btn" data-i18n-aria="decreaseLimit" aria-label="−">−</button>
                    <input type="number" id="threshold-input" step="1" inputmode="numeric" aria-labelledby="limit-section-label threshold-unit-label">
                    <button type="button" id="threshold-inc" class="stepper-btn" data-i18n-aria="increaseLimit" aria-label="+">+</button>
                </div>
                <p class="stepper-unit" id="threshold-unit-label">km/h</p>
                <p class="hint setting-hint" data-i18n="limitsHint"></p>
                <div class="preset-row" id="preset-row"></div>
            </div>

            <p class="section-label" data-i18n="sectionAppearance">देखावट</p>
            <div class="setting-group">
                <div class="field">
                    <span class="setting-title" id="theme-label" data-i18n="theme">थिम</span>
                    <div class="segmented" id="theme-seg" role="radiogroup" aria-labelledby="theme-label">
                        <button type="button" role="radio" data-value="system" data-i18n="themeSystem">स्वतः</button>
                        <button type="button" role="radio" data-value="light" data-i18n="themeLight">उज्यालो</button>
                        <button type="button" role="radio" data-value="dark" data-i18n="themeDark">अँध्यारो</button>
                    </div>
                </div>
                <div class="field">
                    <span class="setting-title" id="language-label" data-i18n="language">भाषा</span>
                    <div class="segmented" id="language-seg" role="radiogroup" aria-labelledby="language-label">
                        <button type="button" role="radio" data-value="ne" data-i18n="langNe">नेपाली</button>
                        <button type="button" role="radio" data-value="en" data-i18n="langEn">English</button>
                    </div>
                </div>
                <div class="field">
                    <span class="setting-title" id="unit-label" data-i18n="units">एकाइ</span>
                    <div class="segmented" id="unit-seg" role="radiogroup" aria-labelledby="unit-label">
                        <button type="button" role="radio" data-value="kmh">km/h</button>
                        <button type="button" role="radio" data-value="mph">mph</button>
                    </div>
                </div>
            </div>

            <p class="section-label" data-i18n="sectionAlerts">चेतावनी</p>
            <div class="setting-group toggles">
                <label class="toggle-row"><span data-i18n="alarmSound">अलार्म ध्वनि</span><input type="checkbox" role="switch" id="toggle-sound" checked></label>
                <label class="toggle-row"><span data-i18n="vibration">कम्पन</span><input type="checkbox" role="switch" id="toggle-vibration" checked></label>
                <label class="toggle-row"><span data-i18n="overspeedNotif">गति सीमा नाघ्यो सूचना</span><input type="checkbox" role="switch" id="toggle-notifications" checked></label>
            </div>

            <p class="section-label" data-i18n="sectionMonitoring">निगरानी</p>
            <div class="setting-group toggles">
                <label class="toggle-row"><span data-i18n="keepAwake">ट्र्याकिङमा स्क्रिन जाग्रित राख्नुहोस्</span><input type="checkbox" role="switch" id="toggle-awake" checked></label>
                <label class="toggle-row">
                    <span><span data-i18n="alwaysOn">सधैं-सक्रिय निगरानी</span><span class="toggle-sub" data-i18n="alwaysOnSub"></span></span>
                    <input type="checkbox" role="switch" id="toggle-always-on">
                </label>
                <label class="toggle-row">
                    <span><span data-i18n="bootAutoStart">रिबुट पछि स्वत: सुरु</span><span class="toggle-sub" data-i18n="bootAutoStartSub"></span></span>
                    <input type="checkbox" role="switch" id="toggle-boot-auto">
                </label>
            </div>

            <p class="section-label" data-i18n="sectionAbout">बारेमा</p>
            <div class="setting-group">
                <p class="about" data-i18n-html="bgBlock"></p>
                <button type="button" id="battery-settings-btn" class="btn-secondary" data-i18n="batterySettings">ब्याट्री सेटिङ खोल्नुहोस्</button>
                <p class="about" data-i18n-html="privacyBlock"></p>
                <p class="about tagline" data-i18n="tagline"></p>
            </div>
        </section>
    </main>

    <nav class="tab-bar" role="tablist">
        <button type="button" class="tab active" role="tab" aria-selected="true" data-screen="home">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 0-8 8 8 8 0 0 0 2.3 5.6l1.4-1.4A6 6 0 0 1 6 12a6 6 0 1 1 12 0 6 6 0 0 1-1.7 4.2l1.4 1.4A8 8 0 0 0 20 12a8 8 0 0 0-8-8zm0 5-2.5 5.5a2 2 0 1 0 3.6 1.7L12 9z"/></svg>
            </span>
            <span data-i18n="tabSpeed">गति</span>
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-screen="trips">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>
            </span>
            <span data-i18n="tabTrips">यात्रा</span>
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-screen="settings">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.9 5.4.1-1.4-.1-1.4 2-1.6-2-3.4-2.4 1a8 8 0 0 0-2.4-1.4L15.6 2h-4l-.5 2.6a8 8 0 0 0-2.4 1.4l-2.4-1-2 3.4 2 1.6-.1 1.4.1 1.4-2 1.6 2 3.4 2.4-1a8 8 0 0 0 2.4 1.4l.5 2.6h4l.5-2.6a8 8 0 0 0 2.4-1.4l2.4 1 2-3.4z"/></svg>
            </span>
            <span data-i18n="tabSettings">सेटिङ</span>
        </button>
    </nav>

    <script type="module" src="js/app.js"></script>
</body>
</html>
